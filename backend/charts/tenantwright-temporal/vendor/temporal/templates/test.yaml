apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "temporal.fullname" . }}-test-cluster-health"
  labels:
    {{- include "temporal.resourceLabels" (list $ "test" "") | nindent 4 }}
    {{- with .Values.test.podLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    "helm.sh/hook": test
    {{- with .Values.test.podAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{ include "temporal.serviceAccount" . }}
  {{- with .Values.test.securityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
  - name: cluster-health
    image: {{ include "temporal.image" .Values.admintools.image | quote }}
    imagePullPolicy: {{ .Values.admintools.image.pullPolicy }}
    {{- with .Values.test.containerSecurityContext }}
    securityContext:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.test.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    command: ["temporal", "operator", "cluster", "health"]
    env:
      - name: TEMPORAL_ADDRESS
        value: {{ include "temporal.fullname" . }}-frontend:{{ .Values.server.frontend.service.port }}
      {{- with .Values.test.additionalEnv }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- with .Values.test.additionalVolumeMounts }}
    volumeMounts:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with $.Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.test.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.test.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.test.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.test.additionalVolumes }}
  volumes:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  restartPolicy: Never
