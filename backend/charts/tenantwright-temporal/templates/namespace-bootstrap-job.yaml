{{- if .Values.namespaceBootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tenantwright-temporal.fullname" . }}-namespace-bootstrap
  labels:
    app.kubernetes.io/name: {{ include "tenantwright-temporal.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: namespace-bootstrap
    app.kubernetes.io/part-of: temporal
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tenantwright-temporal.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: namespace-bootstrap
        app.kubernetes.io/part-of: temporal
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal-namespace-bootstrap
          image: {{ include "tenantwright-temporal.image" .Values.namespaceBootstrap.image | quote }}
          imagePullPolicy: {{ .Values.namespaceBootstrap.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.namespaceBootstrap.temporalAddress | quote }}
            - name: TEMPORAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.namespaceBootstrap.credentialsSecret | quote }}
                  key: api-key
            - name: TEMPORAL_TLS_CA
              value: /etc/temporal/tls/ca.crt
            - name: TEMPORAL_TLS_CERT
              value: /etc/temporal/tls/tls.crt
            - name: TEMPORAL_TLS_KEY
              value: /etc/temporal/tls/tls.key
            - name: TEMPORAL_TLS_SERVER_NAME
              value: {{ .Values.namespaceBootstrap.serverName | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              attempt=1
              until temporal operator cluster health >/dev/null 2>&1; do
                if [ "$attempt" -ge 60 ]; then
                  echo "Temporal did not become healthy within the bounded wait."
                  exit 1
                fi
                attempt=$((attempt + 1))
                sleep 5
              done
              if temporal operator namespace describe --namespace {{ .Values.namespaceBootstrap.namespace | quote }} >/dev/null 2>&1; then
                exit 0
              fi
              temporal operator namespace create \
                --namespace {{ .Values.namespaceBootstrap.namespace | quote }} \
                --retention {{ .Values.namespaceBootstrap.retention | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: temporal-client-tls
              mountPath: /etc/temporal/tls
              readOnly: true
      volumes:
        - name: temporal-client-tls
          secret:
            secretName: {{ .Values.namespaceBootstrap.tlsSecret | quote }}
{{- end }}
