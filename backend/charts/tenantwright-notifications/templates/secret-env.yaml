{{- if and .Values.secretEnv.create .Values.secretEnv.stringData }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tenantwrightapp.secretEnvName" . }}
  labels:
    {{- include "tenantwrightapp.labels" . | nindent 4 }}
  {{- with .Values.secretEnv.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: {{ default "Opaque" .Values.secretEnv.type }}
stringData:
  {{- range $key, $value := .Values.secretEnv.stringData }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}