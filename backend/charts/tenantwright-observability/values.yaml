production:
  enabled: false
  environment: development
  storageClassName: ""
  restoreDrillReference: ""
  objectStorage:
    provider: filesystem
    endpoint: ""
    region: ""
    lokiChunksBucket: ""
    lokiRulerBucket: ""
    lokiAdminBucket: ""
    tempoTracesBucket: ""
    workloadIdentityServiceAccountAnnotation: ""
    workloadIdentityServiceAccountValue: ""
  network:
    kubernetesApiCidrs: []
    clusterNodeCidrs: []
    objectStorageCidrs: []
    remoteWriteCidrs: []
    alertReceiverCidrs: []
    grafanaDatabaseCidrs: []
    grafanaDatabasePort: 5432
    identityProviderCidrs: []
    ingressNamespaces:
      - ingress-nginx
    workloadNamespaces:
      - tenantwright
      - tenantwright-temporal
  remoteWrite:
    url: ""
    secretName: tenantwright-prometheus-remote-write
    credentialsFile: token
  grafana:
    host: ""
    ingressClassName: ""
    clusterIssuer: ""
    oidcIssuerUrl: ""
    oidcAuthorizationUrl: ""
    oidcTokenUrl: ""
    oidcApiUrl: ""
  backup:
    schedule: "0 */6 * * *"
    ttl: 168h
    restoreDrillReference: ""

grafanaAdminSecret:
  create: false
  name: tenantwright-grafana-admin
tenantwrightObservability:
  alerts:
    enabled: true
    targetNamespace: tenantwright
    workloadDeploymentPattern: 'tenantwright-(auditlogs|auth|gateway|identity|notifications|permissions|tenant|workflows)'
  alerting:
    secretName: tenantwright-alerting-secrets
    webhookUrlKey: alertmanager-webhook-url
    heartbeatSecretName: tenantwright-observability-heartbeat
    heartbeatUrlKey: webhook-url
    warningReceiverName: tenantwright-webhook-warning
    criticalReceiverName: tenantwright-webhook-critical
  slos:
    enabled: true
    shortWindow: 5m
    longWindow: 1h
    services:
    - name: ApiGateway
      match: ApiGateway
      errorBudgetRatio: '0.001'
      p95LatencySeconds: '0.75'
    - name: Auth
      match: Auth
      errorBudgetRatio: '0.001'
      p95LatencySeconds: '1.00'
    - name: Identity
      match: Identity
      errorBudgetRatio: '0.001'
      p95LatencySeconds: '0.80'
    - name: Tenant
      match: Tenant
      errorBudgetRatio: '0.001'
      p95LatencySeconds: '0.80'
    - name: Permissions
      match: Permissions
      errorBudgetRatio: '0.001'
      p95LatencySeconds: '0.70'
    - name: AuditLogs
      match: AuditLogs
      errorBudgetRatio: '0.005'
      p95LatencySeconds: '1.20'
    - name: Notifications
      match: Notifications
      errorBudgetRatio: '0.005'
      p95LatencySeconds: '1.20'
  synthetic:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    module: http_2xx
    proberUrl: http://tenantwright-blackbox:9115
    targets:
    - name: gateway-health
      service: ApiGateway
      url: http://tenantwright-gateway.tenantwright.svc.cluster.local/health
    - name: auth-oidc
      service: Auth
      url: http://tenantwright-auth.tenantwright.svc.cluster.local/.well-known/openid-configuration
    - name: identity-health
      service: Identity
      url: http://tenantwright-identity.tenantwright.svc.cluster.local/health
  hardening:
    enabled: true
    ingressAllowedNamespaces:
    - ingress-nginx
    resourceQuota:
      hard:
        requests.cpu: '8'
        requests.memory: 16Gi
        limits.cpu: '24'
        limits.memory: 48Gi
        persistentvolumeclaims: '20'
    limitRange:
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: '1'
        memory: 1Gi
    podDisruptionBudgets:
    - name: tenantwright-grafana-pdb
      minAvailable: 1
      selector:
        app.kubernetes.io/name: grafana
    - name: tenantwright-otel-collector-pdb
      minAvailable: 1
      selector:
        app.kubernetes.io/name: opentelemetry-collector
    - name: tenantwright-loki-pdb
      minAvailable: 1
      selector:
        app.kubernetes.io/name: loki
    - name: tenantwright-tempo-pdb
      minAvailable: 1
      selector:
        app.kubernetes.io/name: tempo
  backupPolicy:
    enabled: true
    tool: velero
    schedule: 0 */6 * * *
    ttl: 168h
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: '1'
  temporal:
    enabled: true
    kubernetesNamespace: tenantwright-temporal
    workflowNamespace: tenantwright-production
    deploymentPattern: 'tenantwright-temporal-temporal-(frontend|history|matching|worker)'
kube-prometheus-stack:
  fullnameOverride: tenantwright-monitoring
  alertmanager:
    enabled: true
    config:
      global:
        resolve_timeout: 5m
      route:
        receiver: 'null'
        group_by:
        - alertname
        - namespace
        - service_name
        - severity
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 2h
        routes:
        - receiver: tenantwright-external-heartbeat
          matchers:
          - alertname="Watchdog"
          repeat_interval: 1m
        - receiver: tenantwright-webhook-critical
          matchers:
          - severity="critical"
          repeat_interval: 30m
        - receiver: tenantwright-webhook-warning
          matchers:
          - severity=~"warning|info"
          repeat_interval: 2h
      inhibit_rules:
      - source_matchers:
        - severity="critical"
        target_matchers:
        - severity=~"warning|info"
        equal:
        - alertname
        - namespace
        - service_name
      receivers:
      - name: 'null'
      - name: tenantwright-external-heartbeat
        webhook_configs:
        - url_file: /etc/alertmanager/secrets/tenantwright-observability-heartbeat/webhook-url
          send_resolved: false
      - name: tenantwright-webhook-warning
        webhook_configs:
        - url_file: /etc/alertmanager/secrets/tenantwright-alerting-secrets/alertmanager-webhook-url
          send_resolved: true
      - name: tenantwright-webhook-critical
        webhook_configs:
        - url_file: /etc/alertmanager/secrets/tenantwright-alerting-secrets/alertmanager-webhook-url
          send_resolved: true
    alertmanagerSpec:
      secrets:
      - tenantwright-alerting-secrets
      - tenantwright-observability-heartbeat
  grafana:
    enabled: true
    fullnameOverride: tenantwright-grafana
    admin:
      existingSecret: tenantwright-grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    grafana.ini:
      auth.anonymous:
        enabled: false
      users:
        viewers_can_edit: false
      server:
        root_url: https://grafana.dev.example.com
    persistence:
      enabled: true
      size: 10Gi
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: '1'
        searchNamespace: ALL
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-staging
      hosts:
      - grafana.dev.example.com
      path: /
      pathType: Prefix
      tls:
      - secretName: tenantwright-grafana-tls
        hosts:
        - grafana.dev.example.com
    additionalDataSources:
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tenantwright-tempo:3100
      isDefault: false
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          filterByTraceID: true
          filterBySpanID: false
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://tenantwright-loki:3100
      isDefault: false
      jsonData:
        derivedFields:
        - name: TraceId
          matcherRegex: trace_id=([0-9a-fA-F]+)
          datasourceUid: tempo
          url: $${__value.raw}
  prometheus:
    prometheusSpec:
      retention: 15d
      retentionSize: 20GiB
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 25Gi
tempo:
  enabled: true
  fullnameOverride: tenantwright-tempo
  persistence:
    enabled: true
    size: 20Gi
  tempo:
    retention: 168h
    searchEnabled: true
    reportingEnabled: false
  serviceMonitor:
    enabled: true
    interval: 30s
tempo-distributed:
  enabled: false
loki:
  fullnameOverride: tenantwright-loki
  deploymentMode: SingleBinary
  test:
    enabled: false
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
      - from: '2026-01-01'
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: tenantwright_loki_index_
          period: 24h
    storage:
      type: filesystem
      bucketNames:
        chunks: tenantwright-loki-chunks
        ruler: tenantwright-loki-ruler
        admin: tenantwright-loki-admin
    limits_config:
      retention_period: 168h
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
      working_directory: /var/loki/compactor
      compaction_interval: 10m
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  monitoring:
    serviceMonitor:
      enabled: true
promtail:
  fullnameOverride: tenantwright-promtail
  config:
    clients:
    - url: http://tenantwright-loki:3100/loki/api/v1/push
prometheus-blackbox-exporter:
  enabled: true
  fullnameOverride: tenantwright-blackbox
  serviceMonitor:
    enabled: true
  config:
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
opentelemetry-collector:
  fullnameOverride: tenantwright-otel-collector
  mode: deployment
  replicaCount: 2
  image:
    repository: otel/opentelemetry-collector-contrib
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
  presets:
    kubernetesAttributes:
      enabled: true
  service:
    enabled: true
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP
    metrics:
      enabled: true
      containerPort: 8889
      servicePort: 8889
      protocol: TCP
  serviceMonitor:
    enabled: true
    metricsEndpoints:
    - port: metrics
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        send_batch_size: 1024
        send_batch_max_size: 4096
        timeout: 1s
      resource:
        attributes:
        - key: service.namespace
          value: tenantwright
          action: upsert
    exporters:
      otlp/tempo:
        endpoint: tenantwright-tempo:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
      otlphttp/loki:
        endpoint: http://tenantwright-loki:3100/otlp
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - batch
          - resource
          exporters:
          - otlp/tempo
        metrics:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - batch
          - resource
          exporters:
          - prometheus
        logs:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - batch
          - resource
          exporters:
          - otlphttp/loki
