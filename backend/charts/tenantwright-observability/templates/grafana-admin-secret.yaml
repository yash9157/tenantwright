{{- if .Values.grafanaAdminSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.grafanaAdminSecret.name | quote }}
  labels:
    app.kubernetes.io/name: tenantwright-observability
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
type: Opaque
stringData:
  admin-user: {{ required "grafanaAdminSecret.username is required when grafanaAdminSecret.create=true" .Values.grafanaAdminSecret.username | quote }}
  admin-password: {{ required "grafanaAdminSecret.password is required when grafanaAdminSecret.create=true" .Values.grafanaAdminSecret.password | quote }}
{{- end }}
