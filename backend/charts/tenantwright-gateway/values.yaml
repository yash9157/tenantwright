nameOverride: ''
fullnameOverride: tenantwright-gateway
image:
  repository: yash9157/tenantwright-gateway
  tag: dev
  digest: ''
  pullPolicy: IfNotPresent
imagePullSecrets: []
replicaCount: 1
rollout:
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  minReadySeconds: 10
  maxUnavailable: 0
  maxSurge: 1
terminationGracePeriodSeconds: 60
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: api.dev.example.com
  hosts:
  - api.dev.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: tenantwright-gateway-tls
  certManager:
    enabled: true
    annotations: {}
    issuerRef:
      name: letsencrypt-prod
      kind: ClusterIssuer
      group: cert-manager.io
serviceAccount:
  create: true
  name: ''
  annotations: {}
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
resources:
  requests:
    cpu: 50m
    memory: 384Mi
  limits:
    cpu: 700m
    memory: 1Gi
nodeSelector: {}
tolerations: []
affinity: {}
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
env:
  ASPNETCORE_ENVIRONMENT: Production
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tenantwright-otel-collector.tenantwright-telemetry.svc:4317
  OTEL_SERVICE_NAME: tenantwright-gateway
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  Hosting__HttpsRedirection__Enabled: 'false'
  AuthServer__Authority: https://auth.dev.example.com/
  AuthServer__Audiences: identity,tenant,permissions,auditlogs,notifications,auth,workflows
  Cors__Origins: https://localhost:4200
  Caching__Provider: Valkey
  Caching__Valkey__Configuration: 'tenantwright-valkey:6379,ssl=True,sslHost=tenantwright-valkey,abortConnect=False,connectRetry=3,connectTimeout=5000,syncTimeout=5000'
  Caching__Valkey__InstanceName: 'TenantWright_'
  Caching__Valkey__User: default
  Caching__Valkey__TrustedCaCertificatePath: /app/valkey-trust/ca.crt
  DistributedLocking__Provider: Valkey
  GatewayLimits__MaxAuthorizationHeaderBytes: '8192'
  GatewayLimits__MaxRequestHeadersTotalSize: '32768'
  ReverseProxy__Clusters__identity__Destinations__identity_1__Address: http://tenantwright-identity:8080/
  ReverseProxy__Clusters__tenant__Destinations__tenant_1__Address: http://tenantwright-tenant:8080/
  ReverseProxy__Clusters__permissions__Destinations__permissions_1__Address: http://tenantwright-permissions:8080/
  ReverseProxy__Clusters__auditlogs__Destinations__auditlogs_1__Address: http://tenantwright-auditlogs:8080/
  ReverseProxy__Clusters__notifications__Destinations__notifications_1__Address: http://tenantwright-notifications:8080/
  ReverseProxy__Clusters__auth__Destinations__auth_1__Address: http://tenantwright-auth:8080/
  ReverseProxy__Clusters__workflows__Destinations__workflows_1__Address: http://tenantwright-workflows:8080/
config:
  forwardedHeaders:
    knownNetworks: []
    knownProxies: []
secretEnv:
  create: false
  existingSecret: ''
  annotations: {}
  type: Opaque
  keys: {}
  stringData: {}
secretRefs:
- envName: Caching__Valkey__Password
  secretName: tenantwright-valkey-auth
  key: default
extraEnv: []
probes:
  startup:
    enabled: true
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 60
  readiness:
    enabled: true
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6
  liveness:
    enabled: true
    path: /alive
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  # Disabled: steady .NET memory use kept small workloads at two replicas.
  # targetMemoryUtilizationPercentage: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
networkPolicy:
  enabled: true
  ingressController:
    enabled: true
    namespace: ingress-nginx
  postgresql:
    enabled: false
    port: 5432
    cidrs: []
  ingress:
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 5671
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tenantwright-telemetry
    ports:
    - protocol: TCP
      port: 4317
  - ports:
    - protocol: TCP
      port: 443
pdb:
  enabled: true
  minAvailable: 1
tests:
  timeoutSeconds: 10
  image:
    repository: busybox
    tag: 1.37.0
    digest: sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
    pullPolicy: IfNotPresent
extraVolumes:
- name: tmp
  emptyDir:
    sizeLimit: 64Mi
- name: valkey-trust
  secret:
    secretName: tenantwright-valkey-tls
    items:
    - key: ca.crt
      path: ca.crt
extraVolumeMounts:
- name: tmp
  mountPath: /tmp
- name: valkey-trust
  mountPath: /app/valkey-trust
  readOnly: true
