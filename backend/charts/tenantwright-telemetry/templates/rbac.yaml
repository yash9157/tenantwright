apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenantwright-otel-collector
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenantwright-otel-collector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [replicasets, deployments, daemonsets, statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenantwright-otel-collector
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: tenantwright-otel-collector }
subjects: [{ kind: ServiceAccount, name: tenantwright-otel-collector, namespace: {{ .Values.namespace }} }]
